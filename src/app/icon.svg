<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#211d18"/>
      <stop offset="55%" stop-color="#161310"/>
      <stop offset="100%" stop-color="#0d0b08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecdcb8"/>
      <stop offset="45%" stop-color="#d8b84a"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底:玄鐵印璽 -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#bg)"/>
  <rect x="5.25" y="5.25" width="53.5" height="53.5" rx="13.75" fill="none" stroke="url(#gold)" stroke-width="2.2"/>

  <!-- 靈光暈染 -->
  <circle cx="32" cy="30" r="24" fill="url(#glow)"/>

  <!-- 四角印紋(呼應站內 deco-frame 花紋) -->
  <g stroke="#c9a227" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M12 16 V12 H16"/>
    <path d="M48 12 H52 V16"/>
    <path d="M52 48 V52 H48"/>
    <path d="M16 52 H12 V48"/>
  </g>

  <!-- 仙:改用黑體粗重字重(而非細筆畫的襯線體),小尺寸下筆畫更均勻、不易糊成歪斜;
       字色改實心金,避免漸層在字形包圍盒上分布不均、造成視覺重心偏移 -->
  <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif"
        font-size="35" font-weight="900" fill="#e8c65a">仙</text>
</svg>
