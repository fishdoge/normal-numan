<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 凡人修仙傳 標誌:由凡入仙
       自下而上:兩道斷爻(凡軀,未成)→ 一道完整的陽爻(道成)→ 頂上一點(飛昇)。
       越往上越亮,象徵修為一路攀升。純幾何、單一金色,16px 仍清楚可辨。 -->
  <rect width="64" height="64" rx="14" fill="#14110d"/>
  <g stroke="#d9b45a" stroke-width="5" stroke-linecap="round">
    <path d="M17 47 H28 M36 47 H47" opacity="0.55"/>
    <path d="M17 36 H28 M36 36 H47" opacity="0.8"/>
    <path d="M17 25 H47"/>
  </g>
  <circle cx="32" cy="14" r="3.6" fill="#f2d27a"/>
</svg>
